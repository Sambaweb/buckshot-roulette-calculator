<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buckshot Roulette Probability Calculator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-red: #cf6679;
            --accent-green: #03dac6;
            --accent-blue: #64b5f6;
            --accent-yellow: #fdd835;
            --text-main: #e0e0e0;
            --text-muted: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overscroll-behavior-y: none;
            background-image: linear-gradient(rgba(18, 18, 18, 0.92), rgba(18, 18, 18, 0.92)), 
                              url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><text x="10" y="50" font-size="40" opacity="0.05">💥</text><text x="60" y="80" font-size="40" opacity="0.05">🧨</text></svg>');
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 0;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2c2c2c;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-box {
            flex: 1 1 30%;
            min-width: 100px;
        }

        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            touch-action: manipulation;
        }

        button:hover { background-color: #444; }

        button.primary {
            background-color: #bb86fc;
            color: #000;
            width: 100%;
            margin-top: 5px;
            font-size: 1.05rem;
            padding: 12px;
        }

        button.primary:hover { background-color: #9965f4; }

        .btn-hard-reset {
            background-color: #b71c1c;
            border: 1px solid #c62828;
            color: white;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 0.9rem;
        }

        .health-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .health-box {
            background-color: #252525;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .health-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .health-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .health-btn {
            background-color: #333;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; padding: 0;
        }
        
        .health-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-yellow);
            min-width: 30px;
        }

        .lln-box {
            background-color: #1a1a1a;
            border: 1px dashed #555;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 10px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: center;
            margin: 15px 0;
        }

        .stat-box {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 0.9rem;
        }

        .stat-box.live { border-color: var(--accent-red); }
        .stat-box.blank { border-color: var(--accent-green); }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .live-text { color: var(--accent-red); }
        .blank-text { color: var(--accent-green); }

        .advice-box {
            background-color: #26222b;
            border: 2px dashed #bb86fc;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
        }

        .item-advice-box {
            background-color: #1e252b;
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .item-advice-box p {
            margin: 4px 0;
            border-bottom: 1px solid #2a333b;
            padding-bottom: 6px;
        }
        .item-advice-box p:last-child { border-bottom: none; }

        .advice-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .advice-text {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .magazine-visual {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            justify-content: center;
        }

        .slot-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }

        .slot {
            width: 35px; height: 35px;
            border-radius: 50%;
            background-color: #2b2b2b;
            border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: bold;
            cursor: pointer;
        }

        .slot.current { border-color: #ffeb3b; box-shadow: 0 0 8px #ffeb3b; }
        .slot.live { background-color: var(--accent-red); color: white; border-color: #ff8a80; }
        .slot.blank { background-color: var(--accent-green); color: black; border-color: #69f0ae; }
        .slot.unknown { background-color: #2b2b2b; color: var(--text-muted); border-style: dashed; }
        .slot.inverted { box-shadow: 0 0 10px #bb86fc !important; border-color: #bb86fc !important; }

        .slot-prob { font-size: 0.7rem; font-weight: bold; }

        .hint-click {
            font-size: 0.75rem; color: var(--accent-yellow);
            text-align: center; margin-top: 10px; margin-bottom: 10px;
            font-weight: bold; background: #2b2b2b; padding: 6px; border-radius: 6px;
        }

        .action-grid, .item-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-live { background-color: #b71c1c; color: white; border: 1px solid #c62828; padding: 12px; font-size: 0.9rem;}
        .btn-blank { background-color: #1b5e20; color: white; border: 1px solid #2e7d32; padding: 12px; font-size: 0.9rem;}
        
        .item-actions button { background-color: #2b2b2b; border: 1px solid #444; font-size: 0.85rem; }

        .hidden { display: none; }
        
        .footer-info {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            border-top: 1px solid #2c2c2c;
            padding-top: 15px;
        }
        
        .footer-info a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        
        .footer-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 400px) {
            .health-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Shotgun Probabilities</h1>

    <div class="section" id="setup-section">
        <label>Round Start: Configure Magazine</label>
        <div class="input-group">
            <div class="input-box">
                <span style="font-size: 0.8rem; color: var(--accent-red);">Live:</span>
                <input type="number" id="input-live" min="0" max="8" value="2">
            </div>
            <div class="input-box">
                <span style="font-size: 0.8rem; color: var(--accent-green);">Blänk:</span>
                <input type="number" id="input-blank" min="0" max="8" value="2">
            </div>
            <div class="input-box">
                <span style="font-size: 0.8rem; color: var(--accent-yellow);">Max Health:</span>
                <input type="number" id="input-health" min="1" max="8" value="4">
            </div>
        </div>
        <button class="primary" onclick="initRound()">Start Round</button>
        <button class="btn-hard-reset" onclick="hardReset()">🛑 Reset All</button>
    </div>

    <div class="section hidden" id="game-section">
        <div class="health-grid">
            <div class="health-box">
                <div class="health-title">You (Health)</div>
                <div class="health-controls">
                    <button class="health-btn" onclick="changeHealth('player', -1)">-</button>
                    <div class="health-value" id="player-health">4</div>
                    <button class="health-btn" onclick="changeHealth('player', 1)">+</button>
                </div>
            </div>
            <div class="health-box">
                <div class="health-title">Dealer (Health)</div>
                <div class="health-controls">
                    <button class="health-btn" onclick="changeHealth('dealer', -1)">-</button>
                    <div class="health-value" id="dealer-health">4</div>
                    <button class="health-btn" onclick="changeHealth('dealer', 1)">+</button>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label style="margin:0; font-size: 0.8rem;">Barrel Status (Next Shot)</label>
            <button onclick="nextRound()" style="font-size: 0.75rem; padding: 4px 8px; background-color: #5c3a21; border: 1px solid #ff9800; color: #fff;">Next Round</button>
        </div>

        <div class="lln-box" id="lln-display"></div>
        
        <div class="magazine-visual" id="magazine-visual"></div>
        <div class="hint-click">💡 Click Shells: 1x Red (Live) ➔ 2x Green (Blänk) ➔ 3x Grey</div>

        <div class="stats-grid">
            <div class="stat-box live">
                <div>Live (Slot 1)</div>
                <div class="stat-value live-text" id="prob-live">0%</div>
            </div>
            <div class="stat-box blank">
                <div>Blänk (Slot 1)</div>
                <div class="stat-value blank-text" id="prob-blank">0%</div>
            </div>
        </div>

        <div class="advice-box">
            <div class="advice-title">Target Recommendation</div>
            <div class="advice-text" id="advice-text">-</div>
        </div>

        <div class="item-advice-box">
            <div class="advice-title" style="color: var(--accent-blue); margin-bottom: 8px;">💡 Smart Item Tips:</div>
            <div id="item-advice-text">-</div>
        </div>

        <label style="margin-top: 15px; font-size: 0.8rem;">What just came out of the barrel?</label>
        <div class="action-grid">
            <button class="btn-live" onclick="removeShell('live')">💥 LIVE</button>
            <button class="btn-blank" onclick="removeShell('blank')">💨 BLÄNK</button>
        </div>

        <label style="margin-top: 15px; font-size: 0.8rem;">Actions</label>
        <div class="item-actions">
            <button onclick="useInverter()">🔄 Invert</button>
            <button onclick="undoLast()">↩️ Undo</button>
        </div>
        
        <div id="item-info" style="margin-top: 10px; font-size: 0.85rem; color: #ffeb3b; text-align: center; min-height: 20px;"></div>
    </div>
    
    <div class="footer-info">
        v7.7.1 &copy; 2026 by <a href="https://github.com/sambaweb" target="_blank" rel="noopener noreferrer">Sambaweb</a>
    </div>
</div>

<script>
    let magazine = []; let historyStack = [];
    let maxHealth = 4, pHealth = 4, dHealth = 4;
    let totalLivesLeft = 0, totalBlanksLeft = 0;
    let globalTotalLives = 0, globalTotalBlanks = 0;

    // --- EV LOGIC ---
    const evMemo = {};
    function getEV(live, dud) {
        if (live <= 0) return 0;
        if (dud <= 0) return live % 2 === 1 ? 1 : 0;

        const key = `${live},${dud}`;
        if (evMemo[key]) return evMemo[key];

        const total = live + dud;
        const pLive = live / total;
        const pDud = dud / total;

        const evDealer = pLive * (1 - getEV(live - 1, dud)) + pDud * (-getEV(live, dud - 1));
        const evSelf = pLive * (-1 - getEV(live - 1, dud)) + pDud * getEV(live, dud - 1);

        evMemo[key] = Math.max(evDealer, evSelf);
        return evMemo[key];
    }
    // ----------------

    function initRound() {
        totalLivesLeft = parseInt(document.getElementById('input-live').value) || 0;
        totalBlanksLeft = parseInt(document.getElementById('input-blank').value) || 0;
        maxHealth = parseInt(document.getElementById('input-health').value) || 4;
        const total = totalLivesLeft + totalBlanksLeft;
        if (total <= 0 || total > 8) return alert("Please enter 1-8 shells.");
        pHealth = dHealth = maxHealth;
        updateHealthUI();
        magazine = Array.from({length: totalLivesLeft}, () => ({type: 'unknown', inverted: false}))
             .concat(Array.from({length: totalBlanksLeft}, () => ({type: 'unknown', inverted: false})));
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('item-info').innerText = '';
        updateLLN(); updateUI();
    }

    function hardReset() {
        if(confirm("Reset entire game?")) {
            globalTotalLives = globalTotalBlanks = 0;
            document.getElementById('input-live').value = document.getElementById('input-blank').value = 2;
            document.getElementById('input-health').value = 4;
            updateLLN();
        }
    }

    function cycleSlot(index) {
        const slot = magazine[index];
        if (slot.inverted) return alert("⚠️ Inverted! Use 'Undo'.");
        saveState();
        slot.type = slot.type === 'unknown' ? 'live' : slot.type === 'live' ? 'blank' : 'unknown';
        updateUI();
    }

    function saveState() {
        historyStack.push({ magazine: JSON.parse(JSON.stringify(magazine)), pH: pHealth, dH: dHealth, tl: totalLivesLeft, tb: totalBlanksLeft, gl: globalTotalLives, gb: globalTotalBlanks });
    }

    function changeHealth(target, amount) {
        saveState();
        if (target === 'player') pHealth = Math.max(0, Math.min(maxHealth, pHealth + amount));
        else dHealth = Math.max(0, Math.min(maxHealth, dHealth + amount));
        updateHealthUI(); updateUI(); 
    }

    function updateHealthUI() {
        document.getElementById('player-health').innerText = pHealth;
        document.getElementById('dealer-health').innerText = dHealth;
    }

    function updateLLN() {
        const total = globalTotalLives + globalTotalBlanks;
        const llnBox = document.getElementById('lln-display');
        if (total === 0) return llnBox.innerHTML = "⚖️ <b>RNG Trend:</b> No Data";
        llnBox.innerHTML = `⚖️ <b>RNG Trend (${total} Shots):</b> <b>${((globalTotalLives/total)*100).toFixed(1)}%</b> 💥 / <b>${((globalTotalBlanks/total)*100).toFixed(1)}%</b> 💨`;
    }

    function updateUI() {
        const visual = document.getElementById('magazine-visual'); visual.innerHTML = '';
        if (magazine.length === 0) {
            document.getElementById('prob-live').innerText = '0%'; document.getElementById('prob-blank').innerText = '0%';
            document.getElementById('advice-text').innerHTML = `Magazine empty!<br><button class="primary" onclick="nextRound()">Next Round</button>`;
            document.getElementById('item-advice-text').innerText = '-';
            return;
        }

        const knownLives = magazine.filter(x => x.type === 'live').length;
        const knownBlanks = magazine.filter(x => x.type === 'blank').length;
        const unknowns = magazine.filter(x => x.type === 'unknown').length;
        const uLives = Math.max(0, totalLivesLeft - knownLives);
        const uBlanks = Math.max(0, totalBlanksLeft - knownBlanks);
        const totalU = uLives + uBlanks;

        let pLiveBase = 0, pBlankBase = 0;
        if (unknowns > 0 && totalU > 0) {
            pLiveBase = (uLives / totalU) * 100; pBlankBase = (uBlanks / totalU) * 100;
        }

        magazine.forEach((s, i) => {
            const w = document.createElement('div'); w.className = 'slot-wrapper';
            const el = document.createElement('div');
            el.className = `slot ${s.type}`;
            if (i === 0) el.classList.add('current');
            if (s.inverted) el.classList.add('inverted');
            el.innerText = i + 1; el.onclick = () => cycleSlot(i);
            
            const pt = document.createElement('div'); pt.className = 'slot-prob';
            if (s.type === 'live') { pt.innerText = '100%'; pt.style.color = 'var(--accent-red)'; }
            else if (s.type === 'blank') { pt.innerText = '100%'; pt.style.color = 'var(--accent-green)'; }
            else { pt.innerHTML = `<span style="color:var(--accent-red)">${pLiveBase.toFixed(0)}%</span><br><span style="color:var(--accent-green)">${pBlankBase.toFixed(0)}%</span>`; }

            w.appendChild(el); w.appendChild(pt); visual.appendChild(w);
        });

        let pLive, pBlank;
        if (magazine[0].type === 'live') { pLive = 100; pBlank = 0; }
        else if (magazine[0].type === 'blank') { pLive = 0; pBlank = 100; }
        else { pLive = pLiveBase; pBlank = pBlankBase; }

        document.getElementById('prob-live').innerText = pLive.toFixed(0) + '%';
        document.getElementById('prob-blank').innerText = pBlank.toFixed(0) + '%';

        // --- NEW EV ADVICE LOGIC ---
        const adv = document.getElementById('advice-text');
        
        if (totalLivesLeft === 0 || magazine[0].type === 'blank' || pBlank === 100) {
            adv.style.color = 'var(--accent-green)'; 
            adv.innerHTML = 'Shoot yourself!<br><span style="font-size: 0.75rem; color: var(--text-muted);">Free turn secured</span>';
        } else if (magazine[0].type === 'live' || pLive === 100) {
            adv.style.color = 'var(--accent-red)'; 
            adv.innerHTML = 'Shoot the dealer!<br><span style="font-size: 0.75rem; color: var(--text-muted);">Guaranteed hit</span>';
        } else {
            const evLiveChance = uLives / totalU;
            const evDudChance = uBlanks / totalU;
            
            const evDealer = evLiveChance * (1 - getEV(uLives - 1, uBlanks)) + evDudChance * (-getEV(uLives, uBlanks - 1));
            const evSelf = evLiveChance * (-1 - getEV(uLives - 1, uBlanks)) + evDudChance * getEV(uLives, uBlanks - 1);

            if (evDealer > evSelf) {
                adv.style.color = 'var(--accent-red)'; 
                adv.innerHTML = `Shoot the dealer!<br><span style="font-size: 0.75rem; color: var(--text-muted);">EV: Dealer (${evDealer.toFixed(2)}) > You (${evSelf.toFixed(2)})</span>`;
            } else if (evSelf > evDealer) {
                adv.style.color = 'var(--accent-green)'; 
                adv.innerHTML = `Shoot yourself!<br><span style="font-size: 0.75rem; color: var(--text-muted);">EV: You (${evSelf.toFixed(2)}) > Dealer (${evDealer.toFixed(2)})</span>`;
            } else {
                adv.style.color = 'var(--accent-yellow)'; 
                adv.innerHTML = `Doesn't matter (50/50)<br><span style="font-size: 0.75rem; color: var(--text-muted);">Expected Value is equal (${evSelf.toFixed(2)})</span>`;
            }
        }
        // ---------------------------

        let html = "";
        
        // LUPE / HANDY LOGIC
        if (totalLivesLeft === 0 || totalBlanksLeft === 0) {
            html += "<p>🔍/📱 <b>Glass/Phone:</b> Useless (all known).</p>";
        } else {
            if (magazine[0].type !== 'unknown') html += "<p>🔍 <b>Glass:</b> Slot 1 is known.</p>";
            else if (pLive === 50) html += "<p>🔍 <b>Glass:</b> USE URGENTLY! Resolve coin flip.</p>";
            else if (pHealth <= 2 || pHealth < dHealth) html += "<p>🔍 <b>Glass:</b> IMPORTANT! Take no risks.</p>";
            else html += "<p>🔍 <b>Glass:</b> Good for securing the shot.</p>";
            
            if (magazine.length > 1) html += "<p>📱 <b>Phone:</b> Perfect for later slots (2-8).</p>";
            else html += "<p>📱 <b>Phone:</b> Useless (only 1 shell left).</p>";
        }

        // ITEMS LOGIC (Messer & Handschellen)
        if (pLive === 100 || magazine[0].type === 'live') {
            html += "<p>🔪 <b>Saw:</b> MANDATORY! Double damage!</p><p>🔗 <b>Cuffs:</b> PERFECT! Dealer skips turn.</p>";
        } else if (totalLivesLeft === 0 || magazine[0].type === 'blank') {
            html += "<p>🔪 <b>Saw:</b> Useless.</p><p>🔗 <b>Cuffs:</b> WASTE! You get a free turn anyway.</p>";
        } else {
            if (pLive > 50) {
                html += "<p>🔪 <b>Saw:</b> Good risk.</p><p>🔗 <b>Cuffs:</b> Strong play. High hit chance, and if it's a blänk, you keep the gun.</p>";
            } else if (pLive === 50) {
                if (magazine.length === 2) {
                    html += "<p>🔪 <b>Saw:</b> Save it.</p><p>🔗 <b>Cuffs:</b> ZERO RISK! Free shot at him. If it's the blänk, the 100% live one next is yours!</p>";
                } else {
                    html += "<p>🔪 <b>Saw:</b> Save it.</p><p>🔗 <b>Cuffs:</b> Solid for the coin flip. You secure chain control if it turns out to be a blänk.</p>";
                }
            } else {
                html += "<p>🔪 <b>Saw:</b> Save it.</p><p>🔗 <b>Cuffs:</b> Save them. With high blänk chance, better shoot yourself.</p>";
            }
        }

        // ITEMS LOGIC (Bier & Inverter)
        if (pLive === 100 || magazine[0].type === 'live') {
            if (totalLivesLeft > 1 && totalBlanksLeft === 0) html += "<p>🍺 <b>Beer:</b> PRO MOVE! Rack it, keep turn.</p>";
            else html += "<p>🍺 <b>Beer:</b> DO NOT USE! Discards a live shell.</p>";
            html += "<p>🔄 <b>Inverter:</b> DO NOT USE!</p>";
        } else if (totalLivesLeft === 0 || magazine[0].type === 'blank') {
            html += "<p>🍺 <b>Beer:</b> WASTE!</p><p>🔄 <b>Inverter:</b> PERFECT! Fire at dealer.</p>";
        } else if (pLive > 60) {
            html += "<p>🍺 <b>Beer:</b> Bad. Discards a live shell.</p><p>🔄 <b>Inverter:</b> Bad idea.</p>";
        } else if (pBlank > 60) {
            html += "<p>🍺 <b>Beer:</b> Waste! Shoot yourself!.</p><p>🔄 <b>Inverter:</b> Very good!</p>";
        } else {
            html += "<p>🍺 <b>Beer:</b> PERFECT USE! Bypass coin flip.</p><p>🔄 <b>Inverter:</b> Blind use is pointless.</p>";
        }

        // HEALTH LOGIC
        if (pHealth === maxHealth) html += "<p>🚬/💊 <b>Healing:</b> Useless (full).</p>";
        else {
            html += "<p>🚬 <b>Cigarettes:</b> USE IMMEDIATELY!</p>";
            if (pHealth === 1) html += "<p>💊 <b>Pills:</b> EMERGENCY ONLY (-1 kills you).</p>";
            else if (maxHealth - pHealth >= 2) html += "<p>💊 <b>Pills:</b> Good use!</p>";
            else html += "<p>💊 <b>Pills:</b> High risk for +1 health.</p>";
        }
        
        document.getElementById('item-advice-text').innerHTML = html;
    }

    function removeShell(type) {
        if (magazine.length === 0) return;
        saveState();
        if (type === 'live') { totalLivesLeft = Math.max(0, totalLivesLeft - 1); globalTotalLives++; }
        if (type === 'blank') { totalBlanksLeft = Math.max(0, totalBlanksLeft - 1); globalTotalBlanks++; }
        magazine.shift(); document.getElementById('item-info').innerText = `Was ${type === 'live' ? 'LIVE' : 'BLÄNK'}.`;
        updateLLN(); updateUI();
    }

    function useInverter() {
        if (magazine.length === 0) return;
        const s = magazine[0];
        if (s.type === 'unknown') return alert("💡 Click Slot 1 first (Live/Blänk), then invert!");
        saveState();
        if (s.type === 'live') { s.type = 'blank'; totalLivesLeft = Math.max(0, totalLivesLeft-1); totalBlanksLeft++; }
        else { s.type = 'live'; totalBlanksLeft = Math.max(0, totalBlanksLeft-1); totalLivesLeft++; }
        s.inverted = true; document.getElementById('item-info').innerHTML = '🔄 Inverted!<br><span style="color: var(--accent-red);">⚠️ WARNING: Don\'t mix up Live and Blänk when firing now!</span>';
        updateUI();
    }

    function undoLast() {
        if (historyStack.length > 0) {
            const l = historyStack.pop();
            magazine = l.magazine; pHealth = l.pH; dHealth = l.dH;
            totalLivesLeft = l.tl; totalBlanksLeft = l.tb; globalTotalLives = l.gl; globalTotalBlanks = l.gb;
            updateHealthUI(); updateLLN(); document.getElementById('item-info').innerText = '↩️ Undo.'; updateUI();
        }
    }
    function nextRound() { document.getElementById('setup-section').classList.remove('hidden'); document.getElementById('game-section').classList.add('hidden'); historyStack = []; }
</script>
</body>
</html>
